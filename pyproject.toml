[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-router"
version = "0.2.0"
description = "Turn an existing Obsidian vault into an agent-ready knowledge base without moving a note."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KnowledgeRouter contributors" }]
keywords = ["obsidian", "notes", "rag", "retrieval", "agent", "knowledge-base", "fts5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
kr = "knowledge_router.knowledge_router:main"
knowledge-router = "knowledge_router.knowledge_router:main"

[tool.setuptools]
packages = ["knowledge_router"]

[tool.setuptools.package-dir]
knowledge_router = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Duplicate name:UserWarning:zipfile"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"integrations/*" = ["INP001"]
